name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      MT5_BACKEND_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked --offline
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - run: pnpm check
      - run: pnpm tauri build --no-bundle
      - name: Verify Windows release has no console subsystem
        if: runner.os == 'Windows'
        shell: python
        run: |
          from pathlib import Path
          import struct

          image = Path('target/release/better-charts.exe').read_bytes()
          assert image[:2] == b'MZ', 'Missing DOS executable header'
          pe_offset = struct.unpack_from('<I', image, 0x3C)[0]
          assert image[pe_offset:pe_offset + 4] == b'PE\0\0', 'Missing PE header'
          # Subsystem is at offset 68 in both PE32 and PE32+ optional headers.
          subsystem = struct.unpack_from('<H', image, pe_offset + 24 + 68)[0]
          assert subsystem == 2, f'Expected Windows GUI subsystem (2), got {subsystem}'
      - run: python -m py_compile scripts/mock_mt5_bridge.py scripts/capture_reconcile_snapshot.py scripts/check_tick_reader.py
      - run: python scripts/check_tick_reader.py
      - name: Mock bridge self-test
        env:
          MT5_MOCK_SELFTEST: "1"
        run: python scripts/mock_mt5_bridge.py
      - name: Capture tool self-test
        env:
          MT5_CAPTURE_SELFTEST: "1"
        run: python scripts/capture_reconcile_snapshot.py
      - name: Install browser
        if: runner.os == 'Linux'
        run: pnpm --filter better-charts exec playwright install --with-deps chromium
      - name: Browser tests
        if: runner.os == 'Linux'
        run: pnpm test:e2e
